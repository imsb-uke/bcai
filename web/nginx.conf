server {
    listen 80;
    client_max_body_size 20m;

    # Proxy /api/* → backend, stripping the /api prefix
    # Trailing slash on proxy_pass is what performs the strip
    location /api/ {
        proxy_pass            http://api:8000/;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        # SSE requires no buffering — nginx would otherwise hold the stream
        proxy_set_header      Connection        '';
        proxy_buffering       off;
        proxy_read_timeout    3600s;
        chunked_transfer_encoding on;
    }

    # Serve the React SPA; unknown paths fall back to index.html for client routing
    location / {
        root      /usr/share/nginx/html;
        index     index.html;
        try_files $uri $uri/ /index.html;
    }
}
